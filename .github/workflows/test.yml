name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare offline verification bundle
        run: |
          mkdir -p "$RUNNER_TEMP/verification/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/verification/source"
          go mod vendor -o "$RUNNER_TEMP/verification/source/vendor"
          cp -a "$(go env GOROOT)" "$RUNNER_TEMP/verification/go"
          tar -czf "$RUNNER_TEMP/verification.tar.gz" -C "$RUNNER_TEMP/verification" .
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-verification
          path: ${{ runner.temp }}/verification.tar.gz
          retention-days: 1
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o renstiq .
