# 共通 config.yaml の全項目の例。パス・依存名・指示は利用先に合わせる。
# フィルタの許可リストは、省略なら制限なし、空配列なら許可対象なし。
# 同じフィルタ内は AND、別 ID のフィルタ間は OR。全経路に必要な条件は各フィルタに指定する。
# 共通設定が継承の起点。inherit は repo 側だけに指定する。
# 詳細は同じディレクトリの configuration.md。
version: 2

discovery:
  include:
    - /path/to/repositories/*
  exclude:
    - /path/to/repositories/archived-*

defaults:
  github_api_read_retry:
    max_attempts: 3
    interval_seconds: 2
    respect_retry_after: true # APIのRetry-Afterに合わせて待機を延ばす場合だけ指定する。

  pull_requests:
    lock_label: renstiq-locked
    filters:
      - id: renovate
        enabled: true
        authors: [app/renovate, 'renovate[bot]']
        labels: [dependencies, security] # どちらかのラベルが付いたPRに一致する。
        base_branches: [main]
        head_branches: ['renovate/**']
        commit_authors: ['renovate[bot]']
        files: ['**']
        # 依存名を限定する例。全依存を対象にする場合はこの項目を省略する。
        dependencies: [example-package]
        update_types: [patch]

  merge:
    method: squash # squash / merge / rebase

  # 一致するすべてのレビュー指示を適用する。
  # match/exclude の空配列は、フィルタと異なり追加の制限なし。
  review:
    - id: compatibility
      enabled: true
      match:
        filter_ids: [renovate] # このフィルタに一致した候補へ適用。省略・[]ならIDの制限なし。
        changed_files_any: ['**']
        dependencies: [example-package]
        update_types: [patch, minor]
      exclude:
        changed_files_any: []
        dependencies: []
        update_types: []
      instructions: |
        更新内容と変更履歴を調査し、リポジトリ内の利用箇所と既存の機能への影響を確認する。
        CI の状態にかかわらずレビューを実施する。

  on_blocked:
    - id: feedback
      enabled: true
      match:
        changed_files_any: []
        dependencies: []
        update_types: []
      exclude:
        changed_files_any: []
        dependencies: []
        update_types: []
      instructions: |
        レビューで他への影響が理由でマージを見送る場合、根拠と必要な対応をコメントする。
        内容はマージしてよく、再実行で解消が見込める理由で止まった場合はコメントしない。
        同じ理由のコメントを重複投稿しない。どちらの場合も実行結果に理由を残す。
    - id: long-term-lock
      enabled: true
      match:
        changed_files_any: []
        dependencies: []
        update_types: []
      exclude:
        changed_files_any: []
        dependencies: []
        update_types: []
      instructions: |
        長期保留が見込まれる場合、根拠と解除に必要な対応を報告して pull_requests.lock_label を付ける。
        PR が更新されても自動解除しない。ユーザーが手動でラベルを外すまで対象外にする。

  # 個々のマージを確認した直後に行う作業。実行内容はすべて指示文に書く。
  after_merge:
    - id: report-merge
      enabled: true
      match:
        changed_files_any: []
        dependencies: []
        update_types: []
      exclude:
        changed_files_any: []
        dependencies: []
        update_types: []
      instructions: |
        マージした PR の番号と mergeCommit.oid を今回の実行結果に記録する。
        記録を確認できなければ未完了として報告し、残りの PR のレビューは続ける。

  # 今回の確定マージが1件以上あるとき、repo の最後に各 ID を一度実行する。
  after_repo:
    - id: summarize
      enabled: true
      match:
        changed_files_any: []
        dependencies: []
        update_types: []
      exclude:
        changed_files_any: []
        dependencies: []
        update_types: []
      instructions: |
        今回のレビュー判断、マージ結果、コメント、lock、後処理の結果をまとめる。
        マージ成功と後処理失敗を区別し、残っている作業を報告する。
