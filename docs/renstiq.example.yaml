# 各repoのルートに置く。上から最初に一致した1件だけを使う。
version: 2
enabled: true

github_api_read_retry:
  max_attempts: 3
  interval_seconds: 2
  respect_retry_after: true

merge:
  method: squash

rules:
  - id: major-update
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    labels: [major]
    instructions: |
      調査をせずにスキップする。

  - id: minor-patch-update
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    labels: [minor, patch]
    instructions: |
      CIのcheckがOKならマージする。
      Renovate以外の変更履歴、コメント等がある場合はマージしない。

  # 広い条件は後ろに置く。majorやminor/patchは上のルールで決定する。
  - id: other-renovate
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    instructions: |
      調査をせずにスキップする。

on_blocked:
  - id: report-blocked
    instructions: |
      マージを見送った理由を実行結果に記録する。

after_merge:
  - id: report-merge
    instructions: |
      マージしたPRの番号とmergeCommit.oidを実行結果に記録する。

after_repo:
  - id: summarize
    instructions: |
      マージ結果、後処理結果と残作業を報告する。
