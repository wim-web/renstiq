# このrepoだけの処理ポリシー。全設定項目の説明・記入例をコメントに載せている。
# 必要なブロックの先頭の「# 」を親の行から外し、条件・指示を編集する。
version: 2
enabled: true # true の場合だけこのrepoを処理する。false・省略なら参加しない。

# rules は上から評価し、最初に一致した有効な1件の instructions だけを使う。
# 先のルールが情報不足なら、判定を確定するまで後ろのルールへ進まない。
# 一致するルールがないPRは対象外。rules 未指定・[]・全件無効でも対象外。
# instructions の合成、共通ポリシーからの継承、filter_ids による参照はない。
# id は各配列内で一意。英数字で始め、英数字・ハイフン・アンダースコア・ピリオドを使える。
# 条件同士は AND。条件の省略は制限なし、明示した空配列 [] は一致する対象なし。
# rules:
#   - id: dependency-update
#     enabled: true # 省略時 true。false でこのルールを無効化する。
#     authors: [app/renovate, 'renovate[bot]'] # 許可するPR作者。
#     labels: [minor, patch] # 指定ラベルが1つ以上あれば一致。大文字小文字を区別。
#     base_branches: [main] # マージ先ブランチの完全一致。
#     head_branches: ['renovate/**'] # PRブランチのglob。
#     commit_authors: ['renovate[bot]'] # 全コミットの作者のGitHubログイン名を許可する。
#     files: ['**'] # repo相対のglob。全変更パスが一致すること。renameは旧名・新名両方。
#     dependencies: [example-package] # 全更新の依存名を完全一致で許可する。
#     update_types: [minor, patch] # 指定種別の更新が1件以上あれば一致。他種別の混在も可。
#     instructions: |
#       更新内容と変更履歴を調査し、利用箇所と既存機能への影響を確認する。
#       CIの状態にかかわらず、設定したレビューを実施する。
# # update_types に使える値（後処理の match / exclude でも共通）:
# # patch, minor, major, digest, pin, pinDigest, lockFileMaintenance,
# # lockfileUpdate, replacement, rollback, bump
#
# github_api_read_retry: # GitHub APIの読み取りだけに適用。省略・{}なら再試行しない。
#   max_attempts: 3 # 最初の試行を含めた上限。1〜100。1なら再試行なし。
#   interval_seconds: 2 # 0〜86400秒、小数可。max_attempts > 1 なら必須。0は即時再試行。
#   respect_retry_after: true # trueの場合だけRetry-Afterに合わせて待機を延ばす。
#
# merge:
#   method: squash # squash / merge / rebase。未指定なら指示を実施したうえでマージを保留する。
#
# # 以下はAIが実行する保留時・後処理の指示。CLIは実行しない。
# # 該当する有効な項目をすべて設定順に実施する。rulesの先頭一致とは別の処理。
# # match省略・{}・空配列は制限なし。exclude省略・{}・空配列は除外なし。
# # 条件同士はAND。依存名と更新種別は同じ更新を評価する。
# # matchした更新からexcludeした後に1つ以上残れば、その指示を適用する。
# # 各有効項目には空白だけでないinstructionsが必要。コマンドや失敗時の対応も書ける。
# on_blocked: # マージを見送る場合の処理。
#   - id: report-blocked
#     enabled: true # 省略時true。falseで無効化。
#     match:
#       changed_files_any: [] # 変更パスのいずれかに一致するglob。renameの旧名も含む。
#       dependencies: [] # 対象にする依存名の完全一致。
#       update_types: [] # 対象にする更新種別。
#     exclude:
#       changed_files_any: [] # 除外する変更パスのglob。
#       dependencies: [] # 除外する依存名。
#       update_types: [] # 除外する更新種別。
#     instructions: |
#       マージを見送った理由と必要な対応を実行結果に記録する。
#
# after_merge: # 各PRのマージ成功を確認した直後に実行する。
#   - id: report-merge
#     enabled: true
#     match:
#       changed_files_any: []
#       dependencies: []
#       update_types: []
#     exclude:
#       changed_files_any: []
#       dependencies: []
#       update_types: []
#     instructions: |
#       マージしたPRの番号とmergeCommit.oidを実行結果に記録する。
#
# after_repo: # 今回の確定マージが1件以上ある場合、repoの最後に各idを一度実行する。
#   - id: summarize
#     enabled: true
#     match: # マージした各PRに評価し、いずれかが一致すれば適用する。
#       changed_files_any: []
#       dependencies: []
#       update_types: []
#     exclude:
#       changed_files_any: []
#       dependencies: []
#       update_types: []
#     instructions: |
#       選ばれたルール、レビュー判断、マージ結果、後処理結果と残作業を報告する。
