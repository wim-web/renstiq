version: 2
enabled: true

github_api_read_retry:
  max_attempts: 3
  interval_seconds: 2
  respect_retry_after: true

merge:
  method: squash

rules:
  - id: major-update
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    labels: [major]
    instructions: |
      更新内容、リリースノート、破壊的変更とこのrepoでの利用箇所を調査し、既存機能への影響がないと判断できればマージする。
      CIの状態にかかわらず調査を実施し、影響がある場合や判断できない場合はマージしない。
      最新のHEADに対するtestワークフローのcheckが成功し、ほかのCIのcheckにも失敗や未完了がないことを確認する。
      draft、競合あり、CI未実行・失敗・未完了の場合はマージしない。
      Renovate以外の変更履歴、コメント等がある場合はマージしない。

  - id: minor-patch-update
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    labels: [minor, patch]
    instructions: |
      最新のHEADに対するtestワークフローのcheckが成功し、ほかのCIのcheckにも失敗や未完了がなければマージする。
      draft、競合あり、CI未実行・失敗・未完了の場合はマージしない。
      Renovate以外の変更履歴、コメント等がある場合はマージしない。

  - id: other-renovate
    authors: [app/renovate, 'renovate[bot]']
    base_branches: [main]
    instructions: |
      調査をせずにスキップする。

on_blocked:
  - id: report-blocked
    instructions: |
      マージを見送った理由を実行結果に記録する。

after_repo:
  - id: release
    instructions: |
      release-pleaseが今回の変更を含むリリースPRを作成・更新するまで待つ。
      内容とGitHubのマージ条件を確認し、問題がなければマージする。
      マージ後のreleaseワークフローの完了を待ち、成功とGitHub Releaseの公開・配布ファイルを確認する。
